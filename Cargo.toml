[package]
name = "trxscan"
version = "0.0.0"
edition = "2021"
description = "Headless diffusion-MRI simulator: Fiberfox physics in Rust, on trx-rs/odx-rs"
license = "MIT OR Apache-2.0"
repository = ""
publish = false

# Every external dependency is optional and off by default, so the default build is
# pure std: the simulation core compiles and all of its unit tests run with no
# dependencies. Enable a feature to pull in the crates a capability needs (see README).
[features]
default = []
# I/O: TRX streamlines + NIfTI tissue maps + 4D DWI writer
io = ["dep:trx-rs", "dep:nifti", "dep:ndarray", "dep:nalgebra", "mrsim-acq/io"]
# k-space FFT backend (rustfft); the default k-space path is std-only and needs no feature
kspace = ["dep:rustfft", "dep:ndarray", "dep:nalgebra", "dep:rand", "dep:rand_distr", "mrsim-acq/kspace"]
# config parsing (replaces the .ffp XML)
config = ["dep:serde", "dep:toml", "mrsim-acq/config"]
# ground-truth ODF/peak export + optional SH `todf` fast-mode (pulls odx-rs → hdf5)
odx = ["dep:odx-rs", "io"]
# command-line front end (clap); implies `io` since the binaries read/write NIfTI + TRX
cli = ["dep:clap", "io"]
# parallelism
par = ["dep:rayon", "mrsim-acq/par"]

[[bin]]
name = "trxscan"
path = "src/bin/trxscan.rs"
required-features = ["cli"]

[[bin]]
name = "trxscan-microstructure"
path = "src/bin/trxscan_microstructure.rs"
required-features = ["cli"]

[[bin]]
name = "trxscan-benchmark"
path = "src/bin/trxscan_benchmark.rs"
required-features = ["cli"]

[[bin]]
name = "trxscan-gnl"
path = "src/bin/trxscan_gnl.rs"
required-features = ["cli"]

[dependencies]
# --- path deps to sibling checkouts (see the README for the expected layout) ---
trx-rs = { path = "../rust/trx-rs", optional = true }
odx-rs = { path = "../odx-rs", optional = true }
mrsim-acq = { path = "../mrsim-acq" }
# --- I/O + math (versions matched to the sibling crates) ---
nifti = { version = "0.17", features = ["ndarray_volumes"], optional = true }
ndarray = { version = "0.16", optional = true }
nalgebra = { version = "0.33", optional = true }
rustfft = { version = "6", optional = true }
rand = { version = "0.8", optional = true }
rand_distr = { version = "0.4", optional = true }
rayon = { version = "1", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
toml = { version = "0.8", optional = true }
clap = { version = "4", features = ["derive"], optional = true }
