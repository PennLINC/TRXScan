[workspace]
members = [".", "python"]
resolver = "2"

# Single source of truth for the version. `python/Cargo.toml` inherits it and maturin reads it
# at wheel-build time (`dynamic = ["version"]` in python/pyproject.toml); the release workflow
# refuses an `X.Y.Z` tag that disagrees with it.
[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/PennLINC/TRXScan"

[package]
name = "trxscan"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Headless diffusion-MRI simulator: tractogram + tissue maps + scheme to a complex 4D DWI with EPI artifacts, motion and ground truth"
publish = false

# Every external dependency is optional and off by default, so the default build is
# pure std: the simulation core compiles and all of its unit tests run with no
# dependencies. Enable a feature to pull in the crates a capability needs (see README).
[features]
default = []
# I/O: TRX streamlines + NIfTI tissue maps + 4D DWI writer
io = ["dep:trx-rs", "dep:nifti", "dep:ndarray", "dep:nalgebra"]
# k-space FFT backend (rustfft); the default k-space path is std-only and needs no feature
kspace = ["dep:rustfft", "dep:ndarray", "dep:nalgebra", "dep:rand", "dep:rand_distr"]
# config parsing (replaces the .ffp XML)
config = ["dep:serde", "dep:toml"]
# ground-truth ODF/peak export + optional SH `todf` fast-mode (pulls odx-rs → hdf5)
odx = ["dep:odx-rs", "io"]
# command-line front end (clap); implies `io` since the binaries read/write NIfTI + TRX
cli = ["dep:clap", "io"]
# parallelism
par = ["dep:rayon"]

[[bin]]
name = "trxscan"
path = "src/bin/trxscan.rs"
required-features = ["cli"]

[[bin]]
name = "trxscan-microstructure"
path = "src/bin/trxscan_microstructure.rs"
required-features = ["cli"]

[[bin]]
name = "trxscan-benchmark"
path = "src/bin/trxscan_benchmark.rs"
required-features = ["cli"]

[dependencies]
# --- git-pinned sibling crates (no local checkout needed; only fetched when a feature enables them) ---
# trx-rs: the commit the `io` module was written against (8 commits past the v0.1.0 tag).
trx-rs = { git = "https://github.com/tee-ar-ex/trx-rs", rev = "13cfacd397fa1db2d272fa00dfa11f3e3e5e1b40", optional = true }
odx-rs = { git = "https://github.com/PennLINC/odx-rs", tag = "v0.1.3", optional = true }
# --- I/O + math (versions matched to the sibling crates) ---
nifti = { version = "0.17", features = ["ndarray_volumes"], optional = true }
ndarray = { version = "0.16", optional = true }
nalgebra = { version = "0.33", optional = true }
rustfft = { version = "6", optional = true }
rand = { version = "0.8", optional = true }
rand_distr = { version = "0.4", optional = true }
rayon = { version = "1", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
toml = { version = "0.8", optional = true }
clap = { version = "4", features = ["derive"], optional = true }
