name: CI

# Added after a PR review noted that a large number of implementation defects were found only by
# execution, never by reading. Everything here is self-contained: no datasets, no MRtrix, no DIPY.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    name: Rust (pure std, no features)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Build (default features)
        run: cargo build --verbose
      - name: Test (default features)
        run: cargo test --verbose
      # Reported, not enforced: 34 findings, almost all pre-existing in modules this branch does
      # not touch (microstructure, mixture, sphere). Turning it into a gate is a separate cleanup.
      - name: Clippy (advisory)
        run: cargo clippy --all-targets
        continue-on-error: true

  python:
    name: Python scorer and calibration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install --quiet numpy scipy pytest
      - name: Test
        # Self-contained: data-dependent tests skip themselves when the truth bundle, MRtrix or
        # DIPY are absent, so the scorer, its independent cross-check, and the calibration maths
        # all run on a bare runner. Verified locally from the repo root, which is how pytest
        # resolves `scripts/` onto sys.path here.
        run: python -m pytest scripts -q
