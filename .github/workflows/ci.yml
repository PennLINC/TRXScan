name: CI

# Added after a PR review noted that a large number of implementation defects were found only by
# execution, never by reading.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    name: Rust (pure std, no features)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: TRXScan

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: TRXScan

      - name: Build (default features)
        run: cargo build --verbose
        working-directory: TRXScan
      - name: Test (default features)
        run: cargo test --verbose
        working-directory: TRXScan

      # `default = []` and every bin has required-features = ["cli"], so the two steps above
      # compile NO binary at all. Both major regressions in this PR's review history were in
      # src/bin/trxscan.rs wiring, which a green pure-std job never touched.
      #
      # This step RUNS the feature-gated tests rather than merely compiling them. `cli` implies
      # `io`, and src/lib.rs gates the whole `io` module on that feature, so with default features
      # every unit test in src/io.rs -- including the `hires_grid` geometry tests that pin the
      # benchmark affine this branch depends on -- executed in no CI step at all. `--all-targets`
      # also builds the binaries, so it subsumes the `cargo check --bin` it replaces.
      - name: Test the feature-gated code and the production binaries
        run: cargo test --features cli --all-targets --verbose
        working-directory: TRXScan
      # The parallel signal stage has materially different memory and code behaviour. Tested, not
      # merely checked, for the same reason as above.
      - name: Test the parallel path
        run: cargo test --features cli,par --all-targets --verbose
        working-directory: TRXScan
      # The `kspace` feature swaps the x-stage / reconstruction to rustfft and the fieldmap
      # y-sum to the NUFFT. Identical numbers by construction, and the literal-sum oracle test
      # (`restructured_forward_matches_the_literal_sum`) only exercises that path under the feature.
      - name: Test the FFT / NUFFT path
        run: cargo test --features kspace --verbose
        working-directory: TRXScan

      # Reported, not enforced: most findings are pre-existing in modules this branch does not
      # touch (microstructure, mixture, sphere). Making it a gate is a separate cleanup.
      - name: Clippy (advisory)
        run: cargo clippy --all-targets
        working-directory: TRXScan
        continue-on-error: true

  python:
    name: Python scorer and calibration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Deliberately NOT installing nibabel, MRtrix or DIPY: the scorer, its independent
      # cross-check and the calibration maths must stand on numpy/scipy alone. Tests needing more
      # skip themselves via pytest.importorskip, so this run proves the core is self-contained.
      - name: Install
        run: python -m pip install --quiet numpy scipy pytest
      - name: Test
        run: python -m pytest scripts -q
