name: Release wheels + PyPI

# Tag `vX.Y.Z` (matching [workspace.package].version in Cargo.toml) or dispatch manually.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  verify-version:
    name: Verify tag matches Cargo.toml
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: |
          set -euo pipefail
          PKG_VERSION=$(awk '
            /^\[workspace\.package\]/ { in_section = 1; next }
            /^\[/                     { in_section = 0 }
            in_section && /^version[[:space:]]*=/ {
              gsub(/^version[[:space:]]*=[[:space:]]*"|"[[:space:]]*$/, "")
              print
              exit
            }
          ' Cargo.toml)
          echo "Cargo.toml:    $PKG_VERSION"
          echo "version=$PKG_VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" != refs/tags/v* ]]; then
            echo "Not a tag push; skipping tag<->version match."
            exit 0
          fi
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag v$TAG_VERSION does not match [workspace.package].version = \"$PKG_VERSION\"."
            exit 1
          fi

  # The wheel depends only on the std-only simulation core (features kspace,par): no HDF5, no
  # cmake, no system libraries, so the manylinux images need nothing installed.
  linux:
    name: Linux ${{ matrix.target }} (${{ matrix.libc }})
    runs-on: ubuntu-latest
    needs: [verify-version]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64, libc: manylinux }
          - { target: aarch64, libc: manylinux }
          - { target: x86_64, libc: musllinux }
          - { target: aarch64, libc: musllinux }
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist
          working-directory: python
          manylinux: ${{ matrix.libc == 'manylinux' && '2_28' || 'musllinux_1_2' }}
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-${{ matrix.target }}-${{ matrix.libc }}
          path: python/dist

  macos:
    name: macOS ${{ matrix.target }}
    runs-on: ${{ matrix.target == 'aarch64' && 'macos-14' || 'macos-15-intel' }}
    needs: [verify-version]
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist
          working-directory: python
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-macos-${{ matrix.target }}
          path: python/dist

  windows:
    name: Windows x64
    runs-on: windows-latest
    needs: [verify-version]
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          target: x64
          args: --release --out dist
          working-directory: python
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-windows-x64
          path: python/dist

  sdist:
    name: sdist
    runs-on: ubuntu-latest
    needs: [verify-version]
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
          working-directory: python
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: python/dist

  # Install the built wheel into a clean interpreter and run a short simulation.
  smoke:
    name: Install smoke (${{ matrix.os }})
    needs: [linux, macos, windows]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Install wheel and simulate a box
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install --only-binary=:all: --find-links dist trxscan dipy
          python - <<'PY'
          import numpy as np, trxscan as ts
          from dipy.core.gradients import gradient_table
          g = gradient_table(np.array([0, 1000.0]), bvecs=np.array([[0, 0, 0], [1, 0, 0.0]]))
          s = ts.objects.box(6, matrix=16).simulate(g, ts.Protocol.HBCD.replace(voxel_mm=2.0), ts.Artifacts(noise=1e-4))
          print(ts.__version__, s.magnitude.shape, s.kspace.acquired.shape)
          PY

  publish:
    name: Publish to PyPI
    needs: [linux, macos, windows, sdist, smoke]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    environment:
      name: pypi
      url: https://pypi.org/p/trxscan
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: ls -la dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          # Dry-run against TestPyPI first by uncommenting:
          # repository-url: https://test.pypi.org/legacy/
          skip-existing: true
