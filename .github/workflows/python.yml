name: Python

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  python:
    name: trxscan (${{ matrix.os }} / py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # `maturin develop` needs an active virtualenv; export it for the rest of the job.
      - name: Create + activate virtualenv (POSIX)
        if: runner.os != 'Windows'
        working-directory: python
        run: |
          python -m venv .venv
          echo "VIRTUAL_ENV=$PWD/.venv" >> "$GITHUB_ENV"
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: Create + activate virtualenv (Windows)
        if: runner.os == 'Windows'
        working-directory: python
        shell: pwsh
        run: |
          python -m venv .venv
          "VIRTUAL_ENV=$PWD\.venv" | Out-File -FilePath $env:GITHUB_ENV -Append
          "$PWD\.venv\Scripts" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Install build + test deps
        working-directory: python
        run: |
          python -m pip install --upgrade pip
          python -m pip install maturin pytest numpy scipy nibabel pooch dipy trx-python

      - name: Build + install (maturin develop, release)
        working-directory: python
        run: maturin develop --release

      - name: Run tests (no phantom download)
        working-directory: python
        run: python -m pytest tests -q -m "not phantom"
